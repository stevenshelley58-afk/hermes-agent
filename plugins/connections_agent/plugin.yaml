name: connections-agent
version: 0.1.0
description: "Private provider-connection workflow with a narrow Hermes vault broker."
author: Steven Shelley (stevenshelley58-afk), Hermes Agent
kind: backend
provides_tools:
  - connections_agent_status
  - connections_agent_request
  - connections_agent_resend_mcp
requires_env:
  - HERMES_CONNECTIONS_ENABLED
  - HERMES_CONNECTIONS_FRANK_URL
  - HERMES_CONNECTIONS_INFISICAL_URL
  - HERMES_CONNECTIONS_INFISICAL_PROJECT_ID
  - HERMES_CONNECTIONS_INFISICAL_ENVIRONMENT
  - HERMES_CONNECTIONS_INFISICAL_SECRET_PATH
  - HERMES_CONNECTIONS_RESEND_SECRET_NAME
  - HERMES_CONNECTIONS_AGENT_KEY
  - HERMES_VAULT_BROKER_KEY
  - HERMES_CONNECTIONS_INFISICAL_TOKEN
  - HERMES_CONNECTIONS_INFISICAL_CLIENT_ID
  - HERMES_CONNECTIONS_INFISICAL_CLIENT_SECRET
  - HERMES_CONNECTIONS_INFISICAL_ORGANIZATION_SLUG
